{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - IntelliGap</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #123b70 0%,
                    #123b70 45%,
                    #f58220 45%,
                    #f58220 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN CARD */

        .reset-card {
            width: 500px;
            max-width: 90%;
            background: white;
            padding: 45px 50px;
            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        /* LOGO / TITLE */

        .logo-text {
            color: #123b70;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .reset-title {
            color: #f58220;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* FORM */

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #333;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #f58220;

            box-shadow:
                0 0 5px rgba(245, 130, 32, 0.3);
        }

        /* BUTTON */

        .reset-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #f58220;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 5px;
        }

        .reset-btn:hover {
            background: #d96d0d;
        }

        /* ERROR */

        .error-message {
            background: #ffe5e5;
            color: #c00000;

            border: 1px solid #ffb3b3;

            padding: 10px;
            border-radius: 6px;

            margin-bottom: 18px;

            font-size: 13px;
        }

        /* LOGIN LINK */

        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .login-link a {
            color: #f58220;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .reset-card {
                padding: 35px 25px;
            }

            .logo-text {
                font-size: 34px;
            }

            .reset-title {
                font-size: 24px;
            }
        }

    </style>
</head>

<body>

    <div class="reset-card">

        <!-- IntelliGap -->
        <div class="logo-text">
            IntelliGap
        </div>

        <!-- TITLE -->
        <h2 class="reset-title">
            Set New Password
        </h2>

        <p class="subtitle">
            Create a new password for your account
        </p>


        <!-- ERROR -->
        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <!-- FORM -->
        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    maxlength="7"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    maxlength="7"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
            >
                SET NEW PASSWORD
            </button>

        </form>


        <div class="login-link">

            Remember your password?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</body>
</html>
