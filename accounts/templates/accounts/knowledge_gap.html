<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Gap Analysis | IntelliGap</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 30px;
            text-align: center;
        }

        .card {
            background: #172238;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        h1 {
            color: #ff9f43;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .message {
            margin-top: 25px;
            padding: 20px;
            background: #24334d;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #ff9f43;
            color: #111827;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>AI Knowledge Gap Analysis</h1>

            <p>
                Identify your weak topics and understand where you need improvement.
            </p>

            <div class="message">
                <h3>Analysis Not Available Yet</h3>
                <p>
                    Complete a quiz first. Your topic-wise performance and
                    knowledge gap analysis will appear here.
                </p>
            </div>

            <a href="{% url 'student_dashboard' %}">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
