<!DOCTYPE html>
<html>
<head>
    <title>IntelliGap Login</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);
        }

        .box{
            width:420px;
            background:white;
            margin:80px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px gray;
        }

        h1{
            color:#2563eb;
            text-align:center;
        }

        h3{
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:6px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:14px;
            background:#4f46e5;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#2563eb;
        }

        p{
            text-align:center;
        }

        a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:10px;
        }
    </style>

</head>

<body>

<div class="box">

<h1>IntelliGap</h1>

<h3>Student Login</h3>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<form method="POST" autocomplete="off">

{% csrf_token %}

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>
Don't have an account?
<a href="/register/">Register</a>
</p>

</div>

</body>
</html>
