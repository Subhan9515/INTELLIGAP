<!DOCTYPE html>
<html>
<head>
    <title>IntelliGap Registration</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);
        }

        .box{
            width:420px;
            background:white;
            margin:60px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px gray;
        }

        h1{
            color:#2563eb;
            text-align:center;
        }

        h3{
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:6px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:14px;
            background:#4f46e5;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#2563eb;
        }
    </style>

</head>

<body>

<div class="box">

<h1>IntelliGap</h1>

<h3>Student Registration</h3>

<form method="POST">
    {% csrf_token %}

<input type="text" name="full_name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email" autocomplete="off" required>

<input type="password" name="password" placeholder="Password" autocomplete="off" required>

<input type="password" name="confirm_password" placeholder="Confirm Password" required>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
