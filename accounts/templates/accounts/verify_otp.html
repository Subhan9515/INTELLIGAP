<!DOCTYPE html>
<html>

<head>

    <title>Verify OTP - IntelliGap</title>

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #ffffff 55%,
                    #ff6b00 55%,
                    #ff6b00 72%,
                    #0b2d5c 72%
                );
        }

        .box {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px rgba(0,0,0,.2);

            text-align: center;
        }

        h1 {
            color: #0b2d5c;
        }

        h2 {
            color: #f36c21;
        }

        p {
            color: #555;
        }

        input {

            width: 100%;

            padding: 15px;

            margin: 20px 0;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 8px;

            text-align: center;

            font-size: 22px;

            letter-spacing: 5px;
        }

        button {

            width: 100%;

            padding: 14px;

            background: #f36c21;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        .error {

            color: red;

            margin-bottom: 10px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>IntelliGap</h1>

    <h2>Verify OTP</h2>

    <p>
        Enter the 6-digit OTP sent to your registered phone.
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="otp"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            placeholder="000000"
            required
        >

        <button type="submit">
            VERIFY OTP
        </button>

    </form>

</div>

</body>

</html>
