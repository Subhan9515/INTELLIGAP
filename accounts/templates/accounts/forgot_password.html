<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password - IntelliGap</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #ffffff 55%,
                    #ff6b00 55%,
                    #ff6b00 72%,
                    #0b2d5c 72%
                );
        }

        .box {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0,0,0,.2);

            text-align: center;
        }

        h1 {
            color: #0b2d5c;
        }

        h2 {
            color: #f36c21;
        }

        p {
            color: #555;
        }

        input {

            width: 100%;

            padding: 14px;

            margin: 15px 0;

            border: 1px solid #ccc;

            border-radius: 8px;

            box-sizing: border-box;

            font-size: 16px;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #f36c21;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        .back {

            display: block;

            margin-top: 20px;

            color: #f36c21;

            text-decoration: none;
        }

        .error {

            color: red;

            margin-bottom: 10px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>IntelliGap</h1>

    <h2>Forgot Password?</h2>

    <p>
        Enter the phone number you used during registration.
    </p>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="tel"
            name="phone"
            placeholder="Enter registered phone number"
            required
        >

        <button type="submit">
            SEND OTP
        </button>

    </form>

    <a
        href="{% url 'login' %}"
        class="back">

        ← Back to Login

    </a>

</div>

</body>

</html>
